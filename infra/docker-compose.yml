version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: veritas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veritas_db}
      POSTGRES_USER: ${POSTGRES_USER:-veritas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritas_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - veritas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritas_user} -d ${POSTGRES_DB:-veritas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veritas_network

  redis:
    image: redis:7-alpine
    container_name: veritas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - veritas_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veritas_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: veritas_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-veritas_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-veritas_minio_password}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - veritas_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - veritas_network

volumes:
  veritas_pgdata:
    driver: local
  veritas_redisdata:
    driver: local
  veritas_miniodata:
    driver: local

networks:
  veritas_network:
    driver: bridge
