[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-backend"
version = "0.1.0"
description = "Veritas Backend Services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    # ── Data / settings ────────────────────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    # ── Image forensics detectors ──────────────────────────────────────────
    "pillow>=10.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "scipy>=1.12",
    # ── Optional / heavy (AI & C2PA — installed separately in prod) ────────
    # torch>=2.2
    # torchvision>=0.17
    # transformers>=4.44,<5
    # huggingface-hub>=0.24
    # c2pa-python>=0.20
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
asyncio_mode = "auto"

