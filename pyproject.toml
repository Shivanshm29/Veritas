[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.1.0"
description = "Veritas — Provenance, Reliability & Authenticity Monitoring and Analysis Network"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Veritas Architecture Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "pillow>=10.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
lint = [
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "contracts*", "workers*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "backend/tests", "workers/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

